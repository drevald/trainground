apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: amazon-lab
spec:
  replicas: 3
  selector:
    matchLabels: {app: order-app}
  template:
    metadata:
      labels: {app: order-app}
    spec:
      containers:
        - name: app
          image: localhost:5000/app:v1
          imagePullPolicy: Always
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/amazonlab
            - name: SPRING_DATASOURCE_USERNAME
              value: postgres
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef: {name: postgres-secret, key: POSTGRES_PASSWORD}
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: update
            - name: SERVER_PORT
              value: "8080"
          ports: [{containerPort: 8080}]
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: amazon-lab
spec:
  type: NodePort
  selector: {app: order-app}
  ports: [{port: 8080, targetPort: 8080, nodePort: 30080}]
